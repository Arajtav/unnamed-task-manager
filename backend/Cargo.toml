[package]
name = "backend"
edition = "2024"
publish = false

[dependencies]
actix-web = "4.15.0"
chrono = "0.4.45"
sea-orm = { version = "2.0.2", features = [ "sqlx-sqlite", "runtime-tokio", "macros" ] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
