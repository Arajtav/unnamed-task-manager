[package]
name = "backend"
edition = "2024"
publish = false

[dependencies]
actix-cors = "0.7.2"
actix-session = { version = "0.11.0", features = ["cookie-session"] }
actix-web = "4.15.0"
async-graphql = { version = "7.2.1", features = ["chrono", "uuid", "graphiql"] }
async-graphql-actix-web = "7.2.1"
async-trait = "0.1.92"
base64 = "0.23.1"
chrono = "0.4.45"
dotenv = "0.15.0"
email-validator-rfc5322 = "0.1.0"
random-string = "1.1.0"
sea-orm = { version = "2.0.2", features = [ "sqlx-sqlite", "runtime-tokio", "macros" ] }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.26.1", features = ["v4"] }
webauthn-rs = { version = "0.5.5", features = ["conditional-ui", "danger-allow-state-serialisation"] }
